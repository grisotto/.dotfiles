---
# Globals injected by plenary's busted runner, used only under tests/.
base: lua51

globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  pending:
    args:
      - type: string
      - type: function
  before_each:
    args:
      - type: function
  after_each:
    args:
      - type: function
  assert:
    any: true
